name: Composite PR

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy-preview:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy-preview.yml
    needs: test
    secrets: inherit
  e2e:
    uses: ./.github/workflows/e2e.yml
    needs: deploy-preview
    secrets: inherit
    with:
      baseURL: ${{ needs.deploy-preview.outputs.deployment_url }}
