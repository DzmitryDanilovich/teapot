name: Test
description: Run linter, type check, and tests

on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup
        uses: ./.github/actions/setup
      - parallel:
        - name: Run ESLint
          run: pnpm lint
        - name: Run Type check
          run: pnpm typecheck
        - name: Run tests
          run: pnpm test:coverage
      - name: Upload test coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage
          path: coverage/vitest
