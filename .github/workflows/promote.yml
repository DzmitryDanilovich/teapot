name: Promote to Production

on:
  workflow_call:
    inputs:
      baseURL:
        description: 'Base URL for the application under test'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      baseURL:
        description: 'Base URL for the application under test'
        required: false
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
      - name: Promote to production
        run: pnpm exec vercel promote ${{ inputs.baseURL }} --yes --token=${{ secrets.VERCEL_TOKEN }}
